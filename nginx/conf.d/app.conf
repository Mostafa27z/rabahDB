server {
    listen 80;
    server_name api.tamleekuae.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                        # ← correct syntax for nginx ≥1.25
    server_name api.tamleekuae.com;

    ssl_certificate     /etc/letsencrypt/live/api.tamleekuae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tamleekuae.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64M;

    root  /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass        app:9000;
        fastcgi_index       index.php;
        fastcgi_param       SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include             fastcgi_params;
    }
}